name: ActionAvocat — inventaire public manuel
on:
  push:
    branches: [main]
    paths:
      - 'src/content.mjs'
      - 'scripts/inventory-public.mjs'
      - '.github/workflows/inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventorier les liens publics sans authentification
        run: npm run inventory:public
        env:
          MAX_PAGES: '80'
      - name: Conserver le rapport sans le commiter
        uses: actions/upload-artifact@v4
        with:
          name: actionavocat-public-inventory
          path: |
            reports/public-routes.json
            reports/broken-links.json
            reports/apache-redirects.review.conf
          if-no-files-found: error
          retention-days: 7
