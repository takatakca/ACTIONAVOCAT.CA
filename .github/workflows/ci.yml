name: ActionAvocat — build et validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build du site candidat
        run: npm run build
      - name: Tests de non-régression
        run: npm test
      - name: Vérifier les sorties
        run: |
          test -s dist/index.html
          test -s dist/service/droit-civil.html
          test -s dist/sitemap.xml
      - name: Archiver la prévisualisation sans déployer
        uses: actions/upload-artifact@v4
        with:
          name: actionavocat-static-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
